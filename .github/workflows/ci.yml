name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # O build precisa só da URL pública; sem as demais variáveis o site compila normalmente.
      NEXT_PUBLIC_SITE_URL: https://www.draanabeatrizodonto.com.br
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:css
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - run: npm run build
      - run: npm run check:site

  # Auditoria de dependências: informa sem bloquear (vulnerabilidade de produção em nível alto ou crítico).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
